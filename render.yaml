services:
  - type: web
    name: ftrack
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FILETRACK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ftrack
          property: connectionString

databases:
  - name: ftrack
    plan: free
