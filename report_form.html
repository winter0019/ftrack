{% extends "base.html" %}{% block title %}Issue Report | NYSC Katsina Zonal Office{% endblock %}{% block content %}
<div class="head"><div><small>ZONAL INSPECTOR REPORT</small><h1>Issue Report to LGI</h1><p>Send a report to the LGI responsible for the selected LGA.</p></div></div>
<form class="card" method="post"><h2>Report Information</h2><div class="grid"><label>Target LGA <i>*</i><select name="lga" required>{% for x in lgas %}<option>{{x}}</option>{% endfor %}</select></label><label>Report Type<select name="report_type"><option>General LGA Report</option><option>PPA / Employer Report</option><option>Corps Member Report</option></select></label><label>PPA / Employer<input name="ppa_employer" placeholder="Optional"></label><label>Corps Member<input name="corps_member" placeholder="Optional"></label><label>Report Subject <i>*</i><input name="subject" required></label></div><label>Report Content <i>*</i><textarea name="report_body" required placeholder="Enter the report, observations, actions or directives for the LGI."></textarea></label><div class="actions"><a href="{{url_for('reports')}}">Cancel</a><button class="cta">Issue Report</button></div></form>
{% endblock %}
