<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Official Account</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#172832;font-family:Segoe UI,Arial,sans-serif}.bar{background:#07543f;color:#fff;padding:18px 5%;display:flex;align-items:center}.bar h1{margin:0;font-size:20px}.bar a{margin-left:auto;color:#fff;text-decoration:none}.wrap{width:min(900px,92%);margin:30px auto}.panel{background:#fff;border:1px solid #dfe8e5;border-radius:16px;padding:28px;box-shadow:0 8px 28px #143d2e12}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field,select{width:100%;padding:12px;border:1px solid #cfdcd7;border-radius:9px;background:#fff;font:inherit}.btn{background:#07543f;color:#fff;border:0;padding:12px 18px;border-radius:9px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.cancel{background:#e9efed;color:#17372d;margin-left:8px}.hint{font-size:13px;color:#697980;margin-top:5px}.alert{padding:11px 13px;border-radius:9px;margin-bottom:16px;background:#fdecea;color:#8e2419}.success{background:#e7f7ef;color:#14734d}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="bar"><h1>NYSC Katsina Zonal Office · Edit Official Account</h1><a href="{{url_for('users')}}">Back to Accounts</a></div><main class="wrap"><div class="panel"><h2>Edit Official Account</h2>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert {% if category=='success' %}success{% endif %}">{{message}}</div>{% endfor %}{% endwith %}
<form method="post"><div class="grid"><div><label>Full Name</label><input class="field" name="full_name" value="{{user.full_name}}" required></div><div><label>Username</label><input class="field" name="username" value="{{user.username}}" required></div><div><label>New Password <span class="hint">(leave blank to keep current password)</span></label><input class="field" type="password" name="password" minlength="8"></div><div><label>Role</label><select name="role" id="role" required>{% for role in roles %}<option value="{{role}}" {% if user.role==role %}selected{% endif %}>{{role}}</option>{% endfor %}</select></div><div><label>Office</label><input class="field" name="office" value="{{user.office or ''}}" placeholder="e.g. Katsina Zonal Office"></div><div><label>LGA</label><select name="lga" id="lga"><option value="">Not LGA-specific</option>{% for lga in lgas %}<option value="{{lga}}" {% if user.lga==lga %}selected{% endif %}>{{lga}}</option>{% endfor %}</select><div class="hint">For LGI Officers, select the correct assigned LGA.</div></div></div><br><button class="btn" type="submit">Save Changes</button><a class="btn cancel" href="{{url_for('users')}}">Cancel</a></form></div></main>
<script>const role=document.getElementById('role'),lga=document.getElementById('lga');function syncLga(){const isLgi=role.value==='LGI Officer';lga.required=isLgi;if(isLgi&&!lga.value)lga.setCustomValidity('Please select an LGA for the LGI Officer.');else lga.setCustomValidity('')}role.addEventListener('change',syncLga);lga.addEventListener('change',syncLga);syncLga();</script></body></html>
