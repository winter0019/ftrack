<!doctype html><html><head><meta charset="utf-8"><title>{{ppa.name}} Inspection</title><style>body{font-family:Arial;background:#f5f7fb;margin:0;color:#1f2937}.wrap{max-width:1000px;margin:30px auto;padding:18px}.card{background:white;padding:22px;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:18px}.search{display:flex;gap:10px}.search input{flex:1}input,select,textarea,button{padding:11px;box-sizing:border-box;border:1px solid #d1d5db;border-radius:8px;width:100%}button{background:#111827;color:white}.member{display:none;margin-top:15px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.label{color:#6b7280;font-size:13px}.value{font-weight:600}.alert{padding:12px;background:#fee2e2;border-radius:8px;color:#991b1b;margin-top:15px}@media(max-width:700px){.row{grid-template-columns:1fr}.search{display:block}.search button{margin-top:10px}}</style></head><body><div class="wrap"><div class="card"><h1>{{ppa.name}}</h1><p>{{ppa.lga}}</p><p><a href="{{url_for('inspections')}}">← My Inspections</a></p></div><div class="card"><h2>Search Corps Member</h2><div class="search"><input id="state_code" placeholder="Enter State Code, e.g. KT/25B/1386"><button type="button" onclick="findMember()">Search</button></div><div id="message"></div><div id="member" class="member"><h3>Corps Member Details</h3><div class="row"><div><span class="label">Name</span><div class="value" id="m_name"></div></div><div><span class="label">State Code</span><div class="value" id="m_code"></div></div><div><span class="label">Gender</span><div class="value" id="m_gender"></div></div><div><span class="label">Discipline</span><div class="value" id="m_discipline"></div></div><div><span class="label">PPA / Establishment</span><div class="value" id="m_ppa"></div></div><div><span class="label">LGA</span><div class="value" id="m_lga"></div></div></div><hr><form method="post" action="{{url_for('inspection_record')}}"><input type="hidden" name="ppa_id" value="{{ppa.id}}"><input type="hidden" name="corps_member_id" id="member_id"><label>Inspection Status</label><select name="attendance_status" id="attendance_status" onchange="toggleOther()" required><option value="">Select status</option><option>Present</option><option>Absent</option><option>Leave</option><option>Sick Leave</option><option>Maternity Leave</option><option>Others</option></select><div id="query" class="alert" style="display:none">⚠ Absent selected — <b>Query Issued: YES</b></div><div id="other_box" style="display:none;margin-top:12px"><label>Specify reason</label><input name="other_reason"></div><div style="margin-top:12px"><label>Remarks</label><textarea name="remarks" rows="3"></textarea></div><button style="margin-top:12px">Submit Inspection</button></form></div></div></div><script>let found=false;async function findMember(){const code=document.getElementById('state_code').value.trim();const msg=document.getElementById('message');const card=document.getElementById('member');card.style.display='none';msg.textContent='Searching...';if(!code){msg.textContent='Enter a State Code.';return}try{const r=await fetch('{{url_for("inspection_search",ppa_id=ppa.id)}}?state_code='+encodeURIComponent(code));const d=await r.json();if(!d.found){msg.textContent=d.message||'Not found.';return}const m=d.member;document.getElementById('member_id').value=m.id;document.getElementById('m_name').textContent=m.full_name;document.getElementById('m_code').textContent=m.state_code;document.getElementById('m_gender').textContent=m.gender||'—';document.getElementById('m_discipline').textContent=m.discipline||'—';document.getElementById('m_ppa').textContent=m.ppa_name;document.getElementById('m_lga').textContent=m.lga;card.style.display='block';msg.textContent='';}catch(e){msg.textContent='Search failed. Please try again.'}}function toggleOther(){const s=document.getElementById('attendance_status').value;document.getElementById('query').style.display=s==='Absent'?'block':'none';document.getElementById('other_box').style.display=s==='Others'?'block':'none'}</script></body></html>
